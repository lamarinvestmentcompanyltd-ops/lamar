# /etc/nginx/sites-available/lamar   (then: ln -s to sites-enabled, nginx -t, reload)
# Replace lamarinvestment.rw with your real domain. Run certbot afterwards to add HTTPS.
server {
    listen 80;
    server_name lamarinvestment.rw www.lamarinvestment.rw;

    client_max_body_size 10M;          # allows photo uploads in /admin/

    location /static/ { alias /srv/lamar/app/staticfiles/; expires 30d; }
    location /media/  { alias /var/lib/lamar/media/;       expires 7d;  }

    location / {
        proxy_pass http://unix:/run/lamar.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
